name: CI/CD Pipeline

# When the pipeline runs:
#  - push to main          -> full pipeline including publish to GHCR (the "deploy")
#  - pull_request to main  -> test + scan only (no publish), so problems are caught before merge
#  - workflow_dispatch     -> lets you run it manually from the Actions tab
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Least privilege by default: every job starts read-only and we grant more only where needed.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1) Quality gate: lint the code and run the unit tests.
  # ---------------------------------------------------------------------------
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check .

      - name: Run unit tests
        run: pytest -q

  # ---------------------------------------------------------------------------
  # 2) Security gate: scan source for secrets and audit dependencies.
  # ---------------------------------------------------------------------------
  security:
    name: Security Scans
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so the secret scanner can inspect past commits

      - name: Secret scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependency audit (pip-audit)
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt
        # Reported but non-blocking for this exercise; in production this would gate the build.
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # 3) Build, scan the image, and (on main) publish it to GHCR.
  #    This job only starts if BOTH the test and security jobs succeed.
  # ---------------------------------------------------------------------------
  build-scan-push:
    name: Build, Scan & Publish Image
    needs: [test, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # required to push the image to GHCR
      security-events: write   # required to upload scan results to the Security tab
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute lowercase image name
        # GHCR requires the image path to be lowercase.
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build container image
        run: docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .

      - name: Scan image with Trivy (report to Security tab)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE }}:${{ github.sha }}"
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Fail the build on CRITICAL image vulnerabilities (deploy gate)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE }}:${{ github.sha }}"
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image to GHCR
        if: github.event_name == 'push'
        run: |
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
